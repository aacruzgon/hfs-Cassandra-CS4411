  # Finishing touches write code or commits as the bot. Every commit here is
  # signed, carries no AI attribution and is audited before its PR leaves
  # draft, so every one this file can turn off is off.
  #
  # One path is left that no setting turns off: Autofix (formerly
  # Autopilot), which keeps fixing findings and failing CI and resolves
  # merge conflicts. It starts from the Autofix checkbox in CodeRabbit's
  # walkthrough comment, from "@coderabbitai autofix", or from a request to
  # finish the PR such as "@coderabbitai take this PR to completion", and
  # its commits carry "Co-authored-by: coderabbitai[bot]"
  # (https://docs.coderabbit.ai/code/deliver-changes). The schema has no key
  # for it, so the rule is in CLAUDE.md and AGENTS.md ("Commits and CI"):
  # never start it.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

chat:
  art: false
  auto_reply: true

knowledge_base:
  # CodeRabbit reads **/CLAUDE.md and **/AGENTS.md by default, and the root
  # files govern the whole tree; .claude/skills SKILL.md files are read as
  # agent skills. These entries add to the defaults. A guideline file
  # governs only its own directory unless applyTo maps it elsewhere
  # (https://docs.coderabbit.ai/knowledge-base/code-guidelines). Guideline
  # files go here, never in path_instructions, which would review them as
  # code instead.
  code_guidelines:
    enabled: true
    filePatterns:
      # The ADR rules and template govern every member's log.
      - files: "docs/Cassandra/ADR-aacruzgon/ADR-aacruzgon.md"
        applyTo: "docs/Cassandra/ADR-*/**"
      # The design governs the backend, its tests, and the Cassandra docs.
      - files: "docs/Cassandra/cassandra-discussion.md"
        applyTo: "crates/persistence/src/backends/cassandra/**,\
          crates/persistence/tests/cassandra/**,docs/Cassandra/**"
      # The schema's statement rules govern the backend's CQL.
      - files: "docs/Cassandra/schema/README.md"
        applyTo: "crates/persistence/src/backends/cassandra/**"
  # Public repository: "auto" already means this repository only; set
  # explicitly.
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  web_search:
    enabled: true
