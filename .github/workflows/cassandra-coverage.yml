name: Cassandra coverage

# A line and region coverage report for the Cassandra backend
# (crates/persistence/src/backends/cassandra/) and the Cassandra startup path
# in crates/hfs/src/main.rs, measured by the tests that run against a node:
# tests/cassandra_tests.rs, tests/backend_capability_contract.rs, the
# backend's unit tests (its node tests included) and the Milestone A tests
# (the round trip, Step 3 CRUD through REST and readiness), which start the
# real hfs binary.
#
# A report, not a check: its job name is in no ruleset, so it is not
# required, and it has no coverage threshold. It fails only when the build,
# the clean before it, a test or the report itself breaks. It is a workflow
# of its own, so it never touches the five required checks in
# fmt-clippy-cassandra.yml and r4b-compile-check.yml (ADR-aacruzgon-0019,
# 0021).
#
# The job starts its own single-node Cassandra, with its own Compose project
# (hfs-cassandra-cov) and host port (59242), the way the required Cassandra
# job does with hfs-cassandra-ci and 59142 (ADR-sam-michaels-0001,
# ADR-aacruzgon-0020); down -v at the end removes only that project.
#
# Its sections go through the CI report helper (.github/scripts/ci-report.py)
# into the job summary and the artifact ci-report-coverage, with the HTML
# report and lcov.info.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push supersedes the run in flight.
concurrency:
  group: cassandra-coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  # As in fmt-clippy-cassandra.yml: rustup ranks the environment above any
  # directory override left on the runner.
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Cassandra coverage (report only)
    # Fork guard (ADR-aacruzgon-0018).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Light (ADR-aacruzgon-0023): the cold instrumented build peaked at
    # 4821 MiB anon on acruzdebian (run 42254248131) and 4709 MiB on
    # sam-7900x (run 42253148327), more than 2 GiB under acruzdebian's 9 GiB
    # cap, and light keeps it off the heavy queue the required clippy pair
    # waits in.
    runs-on: [self-hosted, hfs-cassandra-light]
    timeout-minutes: 60
    env:
      COMPOSE_FILE: docker/cassandra/docker-compose.yml
      # Neither a developer's 59042 nor the required job's 59142. Every
      # compose command below names this job's own project, hfs-cassandra-cov.
      CASSANDRA_HOST_PORT: 59242
      # No incremental cache in the persistent target dir below.
      CARGO_INCREMENTAL: 0
      LLVM_COV_VERSION: 0.9.1
      # What the CI reports name (ci-report.py context): the build profile,
      # and on a pull request its head, not the merge commit.
      CI_REPORT_PROFILE: test (debug, -C instrument-coverage, CARGO_INCREMENTAL=0)
      CI_REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: llvm-tools-preview

      # Prebuilt binary, checksum-verified by the action; the same action pin
      # as coverage.yml (ADR-aacruzgon-0022), whose manifest lists 0.9.1.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@${{ env.LLVM_COV_VERSION }}

      # ~/.cargo/bin is shared by every job on the runner, and the target
      # dir's stamp below trusts this version.
      - name: Check the cargo-llvm-cov version
        run: cargo llvm-cov --version | grep -qx "cargo-llvm-cov $LLVM_COV_VERSION"

      # A bounded persistent target directory, as in the other workflows
      # (ADR-sam-michaels-0002), of its own: an instrumented build shares no
      # artifacts with an ordinary one. The stamp also names cargo-llvm-cov's
      # version, since its wrapper decides which crates are instrumented.
      # Cargo writes CACHEDIR.TAG only into a target dir it creates itself,
      # and since 1.97 (cargo #16712) `cargo clean --target-dir`, which
      # `cargo llvm-cov clean` runs, refuses a dir without one. The step
      # writes cargo's own text (cargo-util's paths.rs, exclude_from_backups)
      # on every run, so a dir made before this line gets it too.
      - name: Reset the target dir if it is stale or over its cap
        env:
          TARGET_DIR: ${{ runner.workspace }}/target/cassandra-coverage
          CAP_GB: 15
        run: |
          stamp="$(rustc -V) $(sha256sum Cargo.lock | cut -c1-16) cargo-llvm-cov $LLVM_COV_VERSION"
          size_gb=$(du -s --block-size=1G "$TARGET_DIR" 2>/dev/null | cut -f1)
          if [ "$(cat "$TARGET_DIR/.stamp" 2>/dev/null)" != "$stamp" ] || [ "${size_gb:-0}" -gt "$CAP_GB" ]; then
            echo "Resetting $TARGET_DIR (size ${size_gb:-0} GB, cap $CAP_GB GB, stamp: $stamp)"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR" && echo "$stamp" > "$TARGET_DIR/.stamp"
          printf '%s\n' 'Signature: 8a477f597d28d172789f06886806bc55' \
            '# This file is a cache directory tag created by cargo.' \
            '# For information about cache directory tags see https://bford.info/cachedir/' \
            > "$TARGET_DIR/CACHEDIR.TAG"
          echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

      # cargo-llvm-cov's documented flow for coverage of tests it does not run
      # itself (README, "Get coverage of external tests"): show-env, then
      # clean, then plain cargo commands, then `cargo llvm-cov report`. Plain
      # cargo keeps the build and test commands close to the required job's,
      # and lets the Milestone A steps choose their own LLVM_PROFILE_FILE. The
      # wrapper show-env installs instruments the workspace's crates only.
      # -runtime-counter-relocation is the LLVM backend option that lets the
      # Milestone A steps' %c (below) work off Darwin (clang,
      # SourceBasedCodeCoverage, "Running the instrumented program"). It only
      # changes how instrumented code reaches its counters; the other test
      # binaries still write their profiles at exit as usual.
      # $GITHUB_ENV reaches only later steps, so `clean` runs in the build
      # step, where show-env's variables are set.
      - name: Set the coverage environment
        run: |
          echo "RUSTFLAGS=-C llvm-args=-runtime-counter-relocation" >> "$GITHUB_ENV"
          cargo llvm-cov show-env | sed -e "s/^\([A-Z_]*\)='\(.*\)'$/\1=\2/" >> "$GITHUB_ENV"
          cargo llvm-cov show-env

      # `clean --workspace` first (README: after show-env, before the build):
      # it removes the workspace's artifacts and every old profile from this
      # persistent directory, so the report counts this run only; dependencies
      # stay built. The checks after it make sure no profile and none of the
      # test binaries the report reads survived: `cargo llvm-cov clean` only
      # warns when its `cargo clean` fails (its clean.rs), and `report` passes
      # every workspace executable it finds to llvm-cov (its report.rs), so a
      # binary of an earlier run, under another hash, would add its functions
      # to the figures with zero counts.
      # Each build runs under ci-report.py build, which samples the runner's
      # cgroup (peak memory.current and anon, OOM kills) and reports the wall
      # time, as in the required job. Built before Cassandra starts, so the
      # build and the 3 GiB container never overlap. nice: sam-7900x is also
      # Sam's desktop.
      - name: Build the instrumented test binaries and hfs, and report the memory peak
        run: |
          before=$(find "$CARGO_TARGET_DIR" -type f | wc -l)
          cargo llvm-cov clean --workspace
          echo "Files in $CARGO_TARGET_DIR: $before before cargo llvm-cov clean --workspace, $(find "$CARGO_TARGET_DIR" -type f | wc -l) after"
          if [ -n "$(find "$CARGO_LLVM_COV_TARGET_DIR" -maxdepth 1 -name '*.profraw' -print -quit)" ]; then
            echo "::error::profiles of an earlier run are still in $CARGO_LLVM_COV_TARGET_DIR"; exit 1
          fi
          stale=$(find "$CARGO_TARGET_DIR/debug" -maxdepth 2 -type f -perm -u+x \( -name 'hfs' -o -name 'hfs-*' \
            -o -name 'helios_persistence-*' -o -name 'cassandra_tests-*' -o -name 'backend_capability_contract-*' \
            -o -name 'cassandra_milestone_a-*' \) 2>/dev/null || true)
          if [ -n "$stale" ]; then
            echo "::error::cargo llvm-cov clean left test binaries of an earlier run in $CARGO_TARGET_DIR:"; echo "$stale"; exit 1
          fi
          python3 .github/scripts/ci-report.py build build-coverage-persistence \
            "Build: helios-persistence Cassandra tests, instrumented" -- \
            nice -n 10 cargo test -p helios-persistence --features cassandra \
              --lib --test cassandra_tests --test backend_capability_contract --no-run
          python3 .github/scripts/ci-report.py build build-coverage-hfs \
            "Build: hfs (R4, cassandra) and the Milestone A test, instrumented" -- \
            nice -n 10 cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a --no-run

      # A run killed mid-job (cancelled, runner restarted) skips its cleanup.
      - name: Remove leftovers of an earlier run
        run: docker compose -p hfs-cassandra-cov down -v --remove-orphans

      - name: Start Cassandra and wait for its healthcheck
        run: |
          start=$(date +%s)
          docker compose -p hfs-cassandra-cov up -d --wait --wait-timeout 240
          echo "Healthy after $(( $(date +%s) - start )) s"

      # The context every later report section carries, with the node's
      # Cassandra version. Report only.
      - name: Report the context
        continue-on-error: true
        run: python3 .github/scripts/ci-report.py context --cassandra-container hfs-cassandra-cov-cassandra-1

      # The schema checks belong to the required job; this one only applies it.
      - name: Apply keyspace-single-node.cql, then schema.cql
        run: |
          cqlsh --connect-timeout 30 --request-timeout 60 127.0.0.1 "$CASSANDRA_HOST_PORT" \
            -f docs/Cassandra/schema/keyspace-single-node.cql
          cqlsh --connect-timeout 30 --request-timeout 60 127.0.0.1 "$CASSANDRA_HOST_PORT" \
            -k helios -f docs/Cassandra/schema/schema.cql

      # Each test step keeps its output for the test report below, and
      # --show-output prints each passing test's captured output, so that
      # report names every live test that printed a skip.
      - name: cargo test --test cassandra_tests --test backend_capability_contract against this node
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-report/logs"
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
            cargo test -p helios-persistence --features cassandra \
              --test cassandra_tests --test backend_capability_contract -- --show-output 2>&1 \
            | tee "$RUNNER_TEMP/ci-report/logs/persistence-tests.log"

      # With the node's URL, so the node_tests modules in write.rs and
      # backend.rs run instead of skipping. The required job runs the same
      # --lib tests (fmt-clippy-cassandra.yml, ADR-aacruzgon-0054); this run measures
      # their coverage.
      - name: Backend unit tests (--lib, backends::cassandra) against this node
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-report/logs"
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
            cargo test -p helios-persistence --features cassandra --lib -- backends::cassandra \
              --show-output 2>&1 \
            | tee "$RUNNER_TEMP/ci-report/logs/persistence-lib-tests.log"

      # The test kills hfs with SIGKILL when it drops it (Child::kill), and an
      # instrumented program writes its profile only when it exits. %c asks
      # LLVM's profile runtime to keep the counters in the profile file as the
      # program runs (clang, SourceBasedCodeCoverage, "Running the
      # instrumented program"), so a killed hfs still leaves its coverage. The
      # test passes LLVM_PROFILE_FILE through to hfs: it removes only HFS_*,
      # OTEL_* and RUST_LOG. The three Milestone A steps count the profile
      # files they add (one per test binary plus one per hfs), and the
      # coverage section says whether hfs's start_cassandra was recorded.
      - name: Milestone A round trip through hfs against this node
        id: round-trip
        run: |
          set -o pipefail
          before=$(find "$CARGO_LLVM_COV_TARGET_DIR" -maxdepth 1 -name '*.profraw' | wc -l)
          echo "MILESTONE_PROFILES_BEFORE=$before" >> "$GITHUB_ENV"
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
          LLVM_PROFILE_FILE="${LLVM_PROFILE_FILE%.profraw}%c.profraw" \
            cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a -- --exact milestone_a_create_then_read_through_rest \
              --show-output 2>&1 \
            | tee "$RUNNER_TEMP/ci-report/logs/milestone-a-round-trip.log"

      # Roadmap Step 3 through REST: PUT, PATCH, DELETE, HEAD, revive, the
      # batches with ifMatch and /metadata through the real hfs binary, as the
      # required job's "Step 3 CRUD through hfs against this node"
      # (fmt-clippy-cassandra.yml) runs it: the same command, the same
      # exactly-once checks (--exact on a name that matches nothing would pass
      # with 0 tests) and the same timeout. Its own tenant and ids
      # (unique_tenant, unique_suffix), so it cannot meet the round trip's
      # rows; before the readiness test, which restarts the node. %c as above:
      # it kills its hfs too. It runs when the round trip passed, like the
      # readiness test, so its failure fails the job but hides neither that
      # test nor the report steps, which run unless the run is cancelled.
      # The profile files it adds are listed for the crates/rest section,
      # which reports them apart; the trap writes the list on a failure too.
      # Under bash -e a failing command in an EXIT trap would turn the step's
      # status into 1 even when the test passed, so the trap ends in || true.
      - name: Step 3 CRUD through hfs against this node
        id: step3-rest
        if: ${{ !cancelled() && steps.round-trip.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-report/logs"
          log="$RUNNER_TEMP/ci-report/logs/step3-rest.log"
          profiles() { find "$CARGO_LLVM_COV_TARGET_DIR" -maxdepth 1 -name '*.profraw' | sed 's#.*/##' | sort; }
          profiles > "$RUNNER_TEMP/profiles-before-step3.txt"
          trap '{ profiles | comm -13 "$RUNNER_TEMP/profiles-before-step3.txt" - > "$RUNNER_TEMP/step3-profiles.txt"; } || true' EXIT
          if ! grep -q 'fn step3_crud_through_rest' crates/hfs/tests/cassandra_milestone_a.rs; then
            echo "::error title=Step 3 REST test::step3_crud_through_rest is not in crates/hfs/tests/cassandra_milestone_a.rs"
            exit 1
          fi
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
          LLVM_PROFILE_FILE="${LLVM_PROFILE_FILE%.profraw}%c.profraw" \
            cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a -- --exact step3_crud_through_rest \
              --show-output 2>&1 \
            | tee "$log"
          grep -Eq '^test result: ok\. 1 passed;' <(sed 's/\x1b\[[0-9;]*m//g' "$log") \
            || { echo "::error title=Step 3 REST test::step3_crud_through_rest did not run exactly once"; exit 1; }

      # Last test step, as in the required job: it stops and starts this job's
      # own node, named by HFS_TEST_CASSANDRA_STOPPABLE_CONTAINER (the test
      # checks that the container publishes the URL's port).
      - name: Milestone A readiness, stopping and starting this job's node (last test step)
        if: ${{ !cancelled() && steps.round-trip.outcome == 'success' }}
        run: |
          set -o pipefail
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
          HFS_TEST_CASSANDRA_STOPPABLE_CONTAINER=hfs-cassandra-cov-cassandra-1 \
          LLVM_PROFILE_FILE="${LLVM_PROFILE_FILE%.profraw}%c.profraw" \
            cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a -- --exact readiness_reports_down_while_cassandra_is_stopped \
              --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/ci-report/logs/readiness.log"
          after=$(find "$CARGO_LLVM_COV_TARGET_DIR" -maxdepth 1 -name '*.profraw' | wc -l)
          echo "COVERAGE_MILESTONE_PROFILES=$(( after - ${MILESTONE_PROFILES_BEFORE:-0} ))" >> "$GITHUB_ENV"

      # The test counts and skips of every test step. Report only.
      - name: Report the tests
        if: always()
        continue-on-error: true
        run: |
          logs="$RUNNER_TEMP/ci-report/logs"
          python3 .github/scripts/ci-report.py tests tests "Tests" \
            "$logs/persistence-tests.log" "$logs/persistence-lib-tests.log" \
            "$logs/milestone-a-round-trip.log" "$logs/step3-rest.log" "$logs/readiness.log"

      # The report keeps only the backend's files and hfs's main.rs: the
      # ignore regex names every other crate, every other entry of
      # persistence/src and backends/, and every other entry of hfs/src, as
      # the checkout has them (llvm-cov's regex has no negative lookahead).
      # The full llvm-cov export (about 23 MB) feeds the summary script and
      # stays out of the artifact; the section's JSON holds the figures.
      - name: Report the coverage (section, lcov.info, HTML)
        if: ${{ !cancelled() }}
        env:
          COVERAGE_MEASURED: cassandra_tests, backend_capability_contract, the backend's unit tests (node tests included), Milestone A round trip, Step 3 CRUD through REST and readiness
        run: |
          # Every entry of directory $1 but $2 (an ERE), dots escaped, joined by |.
          others() {
            for entry in "$1"/*; do
              entry=${entry##*/}
              if ! echo "$entry" | grep -qxE "$2"; then echo "$entry"; fi
            done | sed 's/\./\\./g' | paste -sd'|' -
          }
          ignore="crates/(($(others crates 'persistence|hfs'))/|persistence/(src/(($(others crates/persistence/src backends))(/|$)|backends/($(others crates/persistence/src/backends cassandra))(/|$))|tests/|benches/|examples/|build\.rs)|hfs/(src/($(others crates/hfs/src main.rs))(/|$)|tests/|benches/|build\.rs))"
          echo "ignore-filename-regex: $ignore"
          out="$RUNNER_TEMP/ci-report/coverage"
          mkdir -p "$out"
          export_json="$RUNNER_TEMP/llvm-cov-export.json"
          cargo llvm-cov report --json --output-path "$export_json" --ignore-filename-regex "$ignore"
          cargo llvm-cov report --lcov --output-path "$out/lcov.info" --ignore-filename-regex "$ignore"
          cargo llvm-cov report --html --output-dir "$out" --ignore-filename-regex "$ignore"
          COVERAGE_LLVM_COV_VERSION=$(cargo llvm-cov --version)
          export COVERAGE_LLVM_COV_VERSION
          python3 .github/scripts/cassandra-coverage-summary.py \
            "$export_json" "$RUNNER_TEMP/coverage-section.md" "$RUNNER_TEMP/coverage-section.json"
          python3 .github/scripts/ci-report.py add coverage "Coverage: Cassandra backend (report only)" \
            --markdown "$RUNNER_TEMP/coverage-section.md" --json "$RUNNER_TEMP/coverage-section.json"

      # Report only, and a section of its own: the backend's scope, figures
      # and files above do not change (ADR-aacruzgon-0070). REST runs in the
      # hfs processes the Milestone A tests start, so a second export of the
      # same profiles, with its own regex keeping only crates/rest/src, shows
      # what the round trip, Step 3 CRUD through REST and readiness reach.
      # A third export sets step 3's profiles aside (into $RUNNER_TEMP, and
      # back), so the section also shows what that step alone adds. A
      # failure here fails neither the job nor the backend report.
      - name: Report the coverage of crates/rest (section)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          others() {
            for entry in "$1"/*; do
              entry=${entry##*/}
              if ! echo "$entry" | grep -qxE "$2"; then echo "$entry"; fi
            done | sed 's/\./\\./g' | paste -sd'|' -
          }
          ignore="crates/(($(others crates rest))/|rest/($(others crates/rest src))(/|$))"
          echo "ignore-filename-regex: $ignore"
          all="$RUNNER_TEMP/llvm-cov-rest.json" without="$RUNNER_TEMP/llvm-cov-rest-without-step3.json"
          cargo llvm-cov report --json --output-path "$all" --ignore-filename-regex "$ignore"
          list="$RUNNER_TEMP/step3-profiles.txt" aside="$RUNNER_TEMP/step3-profiles-aside"
          if [ -s "$list" ]; then
            echo "Step 3's profile files: $(wc -l < "$list")"
            mkdir -p "$aside"
            while IFS= read -r name; do mv "$CARGO_LLVM_COV_TARGET_DIR/$name" "$aside/"; done < "$list"
            cargo llvm-cov report --json --output-path "$without" --ignore-filename-regex "$ignore" || without=-
            mv "$aside"/*.profraw "$CARGO_LLVM_COV_TARGET_DIR/"
          else
            echo "No profile files listed for step 3"; without=-
          fi
          COVERAGE_LLVM_COV_VERSION=$(cargo llvm-cov --version)
          export COVERAGE_LLVM_COV_VERSION
          python3 .github/scripts/cassandra-coverage-rest-summary.py \
            "$all" "$without" "$RUNNER_TEMP/coverage-rest-section.md" "$RUNNER_TEMP/coverage-rest-section.json"
          python3 .github/scripts/ci-report.py add coverage-rest "Coverage: crates/rest through the Cassandra tests (report only)" \
            --markdown "$RUNNER_TEMP/coverage-rest-section.md" --json "$RUNNER_TEMP/coverage-rest-section.json"

      - name: Cassandra logs
        if: failure()
        run: docker compose -p hfs-cassandra-cov logs --tail 200

      # down -v is safe here only because -p names this job's own project.
      - name: Stop Cassandra and remove this job's volume
        if: always()
        run: docker compose -p hfs-cassandra-cov down -v --remove-orphans

      # Every report section of this job, as JSON and Markdown, the raw test
      # logs, the HTML report and lcov.info. Report only: an upload failure
      # does not fail the job.
      - name: Upload the CI report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-coverage
          path: ${{ runner.temp }}/ci-report
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
