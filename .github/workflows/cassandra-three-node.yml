name: Cassandra three nodes (report only)

# The backend's tests against a three-node cluster at RF 3, and a set of pause
# scenarios, nightly and on demand. Every other Cassandra job runs one node;
# section 6's failure tests say "single node first, then the three-node
# cluster", and only three nodes show a one-partition batch timing out as
# SIMPLE, Unavailable once two replicas are marked down, or a two-partition
# batch timing out as BATCH_LOG and still applying (PR #90 review,
# 2026-11-19). This job runs the existing tests there and reports what fails;
# it does not own row 8.3's failure tests (ADR-aacruzgon-0083).
#
# A report, not a check: the job succeeds when tests fail, and its name is in
# no ruleset. It is a workflow of its own, with no pull_request trigger, so it
# never touches the five required checks (ADR-aacruzgon-0019, 0021).
#
# The cluster is docker/cassandra/docker-compose.cluster.yml with
# docker-compose.cluster.heap512m.yml (512M heap, 1700 MiB per node), in its
# own Compose project (hfs-cassandra-3n), subnet (10.59.142.0/24) and host
# ports (59642 to 59644); down -v at the end removes only that project. The
# tests run in a container on the cluster's network (run-tests.sh says why).
#
# Its sections go through the CI report helper (.github/scripts/ci-report.py)
# and the job's own .github/scripts/cassandra-three-node/report.py into the
# job summary and the artifact ci-report-three-node, with the full test logs,
# nodetool status and each node's system.log tail.

on:
  schedule:
    # Daily 10:00 UTC: 06:00 Eastern in summer time, 05:00 in winter (cron is
    # UTC). The quietest hour on the fork's runners: of the last 1,000 runs
    # (2026-11-04 to 2026-11-20), none started between 10:00 and 12:59 UTC and
    # 3 at 09:00, against 45 to 108 an hour in the evening. Clear of the
    # canary (02:00) and the Saturday prune (20:00).
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test (empty: the ref the run was dispatched on)"
        required: false
        default: ""
      test_filter:
        description: "libtest filter for tests/cassandra_tests.rs (empty: every test)"
        required: false
        default: ""
      lib_filter:
        description: "libtest filter for the --lib tests"
        required: false
        default: "node_tests"

permissions:
  contents: read
  # The step-timings report reads this job's steps from the Actions API.
  actions: read

# One run at a time across every ref: two clusters would not fit the 20G a
# job must fit (ADR-aacruzgon-0080), and the ports are fixed. A run that is
# queued waits; it does not cancel the one in flight.
concurrency:
  group: cassandra-three-node
  cancel-in-progress: false

env:
  # As in fmt-clippy-cassandra.yml: rustup ranks the environment above any
  # directory override left on the runner.
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  three-node:
    name: Cassandra three-node tests (report only)
    # Fork guard (ADR-aacruzgon-0018); schedule and dispatch always pass it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Heavy: the build (the required Cassandra job's two persistence binaries,
    # about 5 GiB anon there) and three nodes at 1700 MiB plus a 6 GiB test
    # container. Until PR #100 narrows the label to acruzdebian, heavy also
    # matches sam-7900x, so the job keeps to its 20G cap
    # (ADR-aacruzgon-0023, 0080). The containers run in gh-runner's rootless
    # Docker, outside the runner service's cgroup.
    runs-on: [self-hosted, hfs-cassandra-heavy]
    timeout-minutes: 120
    env:
      THREE_NODE_PROJECT: hfs-cassandra-3n
      COMPOSE_FILE: docker/cassandra/docker-compose.cluster.yml:docker/cassandra/docker-compose.cluster.heap512m.yml
      # Not the base file's 59342 to 59344, the bench harness's 59542, a
      # developer's 59042, the required job's 59142 or coverage's and FHIR
      # versions' 59242; free on acruzdebian on 2026-11-20 (ss -ltn).
      CASSANDRA_CLUSTER_HOST_PORT_1: 59642
      CASSANDRA_CLUSTER_HOST_PORT_2: 59643
      CASSANDRA_CLUSTER_HOST_PORT_3: 59644
      # Outside Docker's default address pools (172.17-31.0.0/16 and
      # 192.168.0.0/16), so no network the daemon has handed out can clash,
      # and clear of slirp4netns's own 10.0.2.0/24.
      CASSANDRA_CLUSTER_SUBNET_PREFIX: 10.59.142
      # No incremental cache in the persistent target dir below.
      CARGO_INCREMENTAL: 0
      CI_REPORT_PROFILE: dev (debug, CARGO_INCREMENTAL=0)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable

      # The commit the reports name (ci-report.py context): the one checked
      # out, which a ref input can make differ from GITHUB_SHA. Set here only,
      # not in the job's env, which would take precedence over $GITHUB_ENV.
      - name: Record the commit and the run's paths
        run: |
          {
            echo "CI_REPORT_COMMIT=$(git rev-parse HEAD)"
            echo "THREE_NODE_OUT=$RUNNER_TEMP/ci-report/three-node"
            echo "THREE_NODE_NETWORK=${THREE_NODE_PROJECT}_cluster"
            echo "THREE_NODE_CONTACT=${CASSANDRA_CLUSTER_SUBNET_PREFIX}.11:9042"
          } >> "$GITHUB_ENV"
          echo "Testing $(git rev-parse HEAD) ($(git log -1 --format=%s))"

      # A bounded persistent target directory of its own, as in the other
      # workflows (ADR-sam-michaels-0002), with the required Cassandra job's
      # cap: it builds the same two binaries, but sharing that directory would
      # let this job's run change what the required job finds warm.
      - name: Reset the target dir if it is stale or over its cap
        env:
          TARGET_DIR: ${{ runner.workspace }}/target/cassandra-three-node
          CAP_GB: 15
        run: |
          stamp="$(rustc -V) $(sha256sum Cargo.lock | cut -c1-16)"
          before_bytes=$(du -s --block-size=1 "$TARGET_DIR" 2>/dev/null | cut -f1)
          size_gb=$(( (${before_bytes:-0} + 1073741823) / 1073741824 ))
          old_stamp=$(cat "$TARGET_DIR/.stamp" 2>/dev/null || true)
          reset=no reason=
          if [ "$old_stamp" != "$stamp" ] || [ "$size_gb" -gt "$CAP_GB" ]; then
            if [ -z "$old_stamp" ]; then reason="no stamp: a new or emptied directory"
            elif [ "$old_stamp" != "$stamp" ]; then reason="stamp changed: the toolchain or Cargo.lock"
            else reason="$size_gb GB, over the $CAP_GB GB cap"; fi
            reset=yes
            echo "Resetting $TARGET_DIR (size $size_gb GB, cap $CAP_GB GB, stamp: $stamp; $reason)"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR" && echo "$stamp" > "$TARGET_DIR/.stamp"
          # The tag cargo writes only into a target dir it creates itself; see
          # cassandra-coverage.yml's reset step.
          printf '%s\n' 'Signature: 8a477f597d28d172789f06886806bc55' \
            '# This file is a cache directory tag created by cargo.' \
            '# For information about cache directory tags see https://bford.info/cachedir/' \
            > "$TARGET_DIR/CACHEDIR.TAG"
          echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          {
            echo "TARGET_DIR_BEFORE_BYTES=${before_bytes:-0}"
            echo "TARGET_DIR_RESET=$reset"
            echo "TARGET_DIR_RESET_REASON=$reason"
            echo "TARGET_DIR_CAP_GB=$CAP_GB"
          } >> "$GITHUB_ENV"

      # Built before the cluster starts, so the build's peak and the nodes
      # never overlap, under ci-report.py build (the runner cgroup's peak
      # memory.current and anon, OOM kills, wall time). Then the same command
      # again with --message-format=json, a no-op that names the two test
      # executables for the steps below, which run them directly.
      - name: Build tests/cassandra_tests.rs and the --lib tests, and report the memory peak
        id: build
        run: |
          python3 .github/scripts/ci-report.py build build-three-node \
            "Build: helios-persistence cassandra_tests and --lib tests" -- \
            nice -n 10 cargo test -p helios-persistence --features cassandra \
              --test cassandra_tests --lib --no-run --timings
          cargo test -p helios-persistence --features cassandra --test cassandra_tests --lib \
              --no-run --message-format=json 2>/dev/null \
            | python3 -c '
          import json, sys
          for line in sys.stdin:
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("reason") != "compiler-artifact" or not m.get("executable") or not m.get("profile", {}).get("test"):
                  continue
              t = m["target"]
              if t["name"] == "cassandra_tests" and "test" in t["kind"]:
                  print("CASSANDRA_TESTS_BIN=" + m["executable"])
              elif "lib" in t["kind"]:
                  print("PERSISTENCE_LIB_BIN=" + m["executable"])
          ' | tee -a "$GITHUB_ENV"
          grep -q '^CASSANDRA_TESTS_BIN=' "$GITHUB_ENV" && grep -q '^PERSISTENCE_LIB_BIN=' "$GITHUB_ENV"

      # A run killed mid-job (cancelled, runner restarted) skips its cleanup.
      - name: Remove leftovers of an earlier run
        run: |
          docker ps -aq --filter "name=^hfs-cassandra-3n-tests-" | xargs -r docker rm -f
          docker compose -p "$THREE_NODE_PROJECT" unpause 2>/dev/null || true
          docker compose -p "$THREE_NODE_PROJECT" down -v --remove-orphans
          echo "THREE_NODE_IMAGE=$(docker compose -p "$THREE_NODE_PROJECT" config --images | sort -u | head -1)" >> "$GITHUB_ENV"

      # From before the boot to the end: the three nodes and the test
      # containers every 5 s, and the host's MemAvailable.
      - name: Start the memory sampler
        run: |
          mkdir -p "$THREE_NODE_OUT"
          nohup .github/scripts/cassandra-three-node/sample-memory.sh \
            "$THREE_NODE_OUT/memory-samples.tsv" "hfs-cassandra-3n-" 5 > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/three-node-sampler.pid"
          echo "Host before the boot:"; free -m

      # The nodes start one at a time behind their CQL healthcheck (the base
      # file's depends_on), about a minute each.
      - name: Start the three nodes and wait for their healthchecks
        id: cluster
        run: |
          python3 .github/scripts/ci-report.py timed node-start "Start and healthcheck, three nodes (compose up --wait)" -- \
            docker compose -p "$THREE_NODE_PROJECT" up -d --wait --wait-timeout 900

      - name: Wait until node 1 sees three nodes UN
        run: |
          n1="$THREE_NODE_PROJECT-cassandra-1-1"
          for _ in $(seq 1 90); do
            up=$(docker exec -e MAX_HEAP_SIZE=128m "$n1" nodetool status 2>/dev/null | grep -c '^UN' || true)
            [ "$up" = 3 ] && break
            sleep 2
          done
          docker exec -e MAX_HEAP_SIZE=128m "$n1" nodetool status
          [ "$up" = 3 ] || { echo "::error::node 1 sees $up nodes UN, not 3"; exit 1; }

      - name: Report the context
        continue-on-error: true
        run: python3 .github/scripts/ci-report.py context --cassandra-container "$THREE_NODE_PROJECT-cassandra-1-1"

      # keyspace-three-node.cql (RF 3) instead of keyspace-single-node.cql,
      # then the signed-off schema.cql, from the runner through node 1's
      # published port (cqlsh talks to that node only). Then until every node
      # reports the same schema version.
      - name: Apply keyspace-three-node.cql, then schema.cql, and wait for schema agreement
        id: schema
        run: |
          python3 .github/scripts/ci-report.py timed node-start "Apply keyspace-three-node.cql (RF 3)" -- \
            cqlsh --connect-timeout 30 --request-timeout 60 127.0.0.1 "$CASSANDRA_CLUSTER_HOST_PORT_1" \
              -f docker/cassandra/keyspace-three-node.cql
          python3 .github/scripts/ci-report.py timed node-start "Apply schema.cql (ten tables)" -- \
            cqlsh --connect-timeout 30 --request-timeout 60 127.0.0.1 "$CASSANDRA_CLUSTER_HOST_PORT_1" \
              -k helios -f docs/Cassandra/schema/schema.cql
          n1="$THREE_NODE_PROJECT-cassandra-1-1"
          for _ in $(seq 1 60); do
            versions=$(docker exec -e MAX_HEAP_SIZE=128m "$n1" nodetool describecluster 2>/dev/null \
              | awk '/Schema versions:/ {f = 1; next} f && /\[/ {c++} f && /^$/ {f = 0} END {print c + 0}')
            [ "$versions" = 1 ] && break
            sleep 2
          done
          docker exec -e MAX_HEAP_SIZE=128m "$n1" nodetool describecluster
          [ "$versions" = 1 ] || { echo "::error::$versions schema versions, not 1"; exit 1; }
          cqlsh 127.0.0.1 "$CASSANDRA_CLUSTER_HOST_PORT_1" -e \
            "SELECT keyspace_name, replication FROM system_schema.keyspaces WHERE keyspace_name = 'helios';"

      - name: Report the nodes' start and schema apply
        continue-on-error: true
        timeout-minutes: 2
        run: python3 .github/scripts/ci-report.py node-start node-start "Cassandra start and schema apply (node 1)" "$THREE_NODE_PROJECT-cassandra-1-1" node-start

      # Step 1: tests/cassandra_tests.rs against the cluster, through node 1
      # (HFS_TEST_CASSANDRA_URL, tests/common/cassandra.rs). The driver
      # routes to all three. --show-output, as in the required job, so the
      # test report names every live test that printed a skip. A failing test
      # fails this step only (continue-on-error); the reports below read it.
      - name: tests/cassandra_tests.rs against the three nodes
        id: cassandra-tests
        if: ${{ !cancelled() && steps.schema.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        env:
          FILTER: ${{ inputs.test_filter }}
          THREE_NODE_TEST_TIMEOUT_MIN: 35
        run: |
          .github/scripts/cassandra-three-node/run-tests.sh cassandra-tests tests/cassandra_tests.rs \
            "$CASSANDRA_TESTS_BIN" ${FILTER:+"$FILTER"} --show-output

      # Step 2: the backend's live unit tests, every node_tests module
      # (write.rs, backend.rs, delete.rs, update.rs, upsert.rs, versions.rs).
      # restart_tests and tombstone_limit_tests skip: they need their own
      # variables and a node of their own.
      - name: --lib node_tests against the three nodes
        id: lib-tests
        if: ${{ !cancelled() && steps.schema.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          FILTER: ${{ inputs.lib_filter || 'node_tests' }}
          THREE_NODE_TEST_TIMEOUT_MIN: 25
        run: |
          .github/scripts/cassandra-three-node/run-tests.sh persistence-lib-tests "unittests src/lib.rs" \
            "$PERSISTENCE_LIB_BIN" "$FILTER" --show-output

      # After the tests, so a paused node cannot reach them: one or two
      # replicas paused, raw CQL from cqlsh on node 1, the results read back
      # at ALL (pause-scenarios.sh). It unpauses every node when it ends.
      - name: Pause scenarios (one replica, two, two marked down, a two-partition batch)
        id: pause
        if: ${{ !cancelled() && steps.schema.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        run: .github/scripts/cassandra-three-node/pause-scenarios.sh "$THREE_NODE_OUT/pause"

      # What each node saw, before anything below can stop it: nodetool
      # status and describecluster from every node, each node's state, its
      # cgroup's memory.peak and OOM kills, and the tail of its system.log
      # and of its container log. Collected whatever happened above.
      - name: Collect nodetool status and each node's system.log tail
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          dir="$THREE_NODE_OUT/nodes"
          mkdir -p "$dir"
          docker compose -p "$THREE_NODE_PROJECT" unpause 2>/dev/null || true
          for n in 1 2 3; do
            c="$THREE_NODE_PROJECT-cassandra-$n-1"
            docker inspect "$c" --format '{{.State.Status}} exit={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} restarts={{.RestartCount}}' \
              > "$dir/cassandra-$n.state" 2>&1 || true
            docker exec "$c" sh -c 'cd /sys/fs/cgroup && echo "memory.peak $(cat memory.peak)" && echo "memory.max $(cat memory.max)" && grep -E "^(oom|oom_kill) " memory.events' \
              > "$dir/cassandra-$n.cgroup" 2>&1 || true
            docker exec -e MAX_HEAP_SIZE=128m "$c" nodetool status > "$dir/cassandra-$n-nodetool-status.txt" 2>&1 || true
            docker exec -e MAX_HEAP_SIZE=128m "$c" nodetool describecluster > "$dir/cassandra-$n-describecluster.txt" 2>&1 || true
            docker exec "$c" tail -n 5000 /opt/cassandra/logs/system.log > "$dir/cassandra-$n-system.log" 2>&1 || true
            docker logs --tail 500 "$c" > "$dir/cassandra-$n-container.log" 2>&1 || true
            echo "cassandra-$n: $(cat "$dir/cassandra-$n.state"); $(tr '\n' ' ' < "$dir/cassandra-$n.cgroup")"
          done
          cat "$dir/cassandra-1-nodetool-status.txt"
          grep -hE ' (ERROR|WARN) ' "$dir"/cassandra-*-system.log | tail -n 40 || true

      # tablestats, tpstats (dropped messages), latency and CAS counts, GC,
      # per node, after everything the tests and the scenarios did. Report
      # only. Last before the cluster stops: each is a nodetool JVM in the
      # node's own cgroup.
      - name: Report each node's statistics and the intent rows left behind
        if: ${{ !cancelled() && steps.schema.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 12
        run: |
          for n in 1 2 3; do
            python3 .github/scripts/ci-report.py node-stats "node-stats-$n" "Node statistics: cassandra-$n" \
              "$THREE_NODE_PROJECT-cassandra-$n-1"
          done
          python3 .github/scripts/ci-report.py intents intents "Intent rows left in pending_index_writes" \
            "$THREE_NODE_PROJECT-cassandra-1-1"

      - name: Stop the memory sampler
        if: always()
        continue-on-error: true
        run: |
          kill "$(cat "$RUNNER_TEMP/three-node-sampler.pid")" 2>/dev/null || true
          echo "Host after the tests:"; free -m

      # down -v is safe here only because -p names this job's own project.
      # Also after a failure, a timeout or a cancel (always()).
      - name: Stop the cluster and remove this job's volumes
        if: always()
        run: |
          docker ps -aq --filter "name=^hfs-cassandra-3n-tests-" | xargs -r docker rm -f
          docker compose -p "$THREE_NODE_PROJECT" unpause 2>/dev/null || true
          docker compose -p "$THREE_NODE_PROJECT" down -v --remove-orphans

      # The counts and skips of both test steps (ci-report.py), then every
      # failing test with its first line and whether it is a #77 504, the
      # pause scenarios, the memory figures and the CAS counters. Report only.
      - name: Report the tests, the failures, the pause scenarios and the memory
        if: always()
        continue-on-error: true
        run: |
          out="$THREE_NODE_OUT" in="$RUNNER_TEMP/ci-report/inputs/three-node"
          mkdir -p "$in"
          report=.github/scripts/cassandra-three-node/report.py
          python3 .github/scripts/ci-report.py tests tests "Tests on three nodes" \
            "$out/logs/cassandra-tests.log" "$out/logs/persistence-lib-tests.log"
          python3 "$report" tests "$out" "$in/failures.md" "$in/failures.json"
          python3 .github/scripts/ci-report.py add failures "Failing tests on three nodes, by cause" \
            --markdown "$in/failures.md" --json "$in/failures.json"
          python3 "$report" pause "$out/pause" "$in/pause.md" "$in/pause.json"
          python3 .github/scripts/ci-report.py add pause "Pause scenarios (raw CQL, RF 3)" \
            --markdown "$in/pause.md" --json "$in/pause.json"
          python3 "$report" memory "$out" "$in/memory.md" "$in/memory.json"
          python3 .github/scripts/ci-report.py add memory "Memory: the nodes and the test containers" \
            --markdown "$in/memory.md" --json "$in/memory.json"
          python3 .github/scripts/ci-report.py cas cas "CAS outcome counters" \
            "$out/logs/cassandra-tests.log" "$out/logs/persistence-lib-tests.log"

      - name: Report the target directory's size
        if: always()
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/ci-report/inputs/build-size"
          python3 .github/scripts/build-size-report.py "$out"
          python3 .github/scripts/ci-report.py add build-size "Target directory size" \
            --markdown "$out/build-size.md" --json "$out/build-size.json"

      - name: Report where this job's time went
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/ci-report/inputs/step-timings"
          python3 .github/scripts/job-step-timings.py "Cassandra three-node tests (report only)" "$out"
          python3 .github/scripts/ci-report.py add step-timings "Where this job's time went" \
            --markdown "$out/step-timings.md" --json "$out/step-timings.json"

      # Every report section, the full test logs, nodetool status, each
      # node's system.log tail, the pause scenarios' raw outputs and the
      # memory samples. Report only: an upload failure does not fail the job.
      - name: Upload the CI report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-three-node
          path: ${{ runner.temp }}/ci-report
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
