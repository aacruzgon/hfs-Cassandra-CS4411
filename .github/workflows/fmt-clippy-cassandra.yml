name: fmt, clippy and Cassandra schema

# Roadmap item 0.5 on the team's self-hosted runner (ADR-aacruzgon-0018,
# ADR-sam-michaels-0001): rustfmt, the CONTRIBUTING.md clippy command split
# into two jobs, and a single-node Cassandra that the schema is applied to and
# tests/cassandra_tests.rs and tests/backend_capability_contract.rs run
# against (ADR-aacruzgon-0020).
# fmt and the Cassandra job are light and run on either runner; the clippy
# pair is heavy and runs only on sam-7900x (ADR-aacruzgon-0023). Each runner
# has one executor, so the jobs on one machine run one after another.
# Every job that compiles also writes CI reports (.github/scripts/ci-report.py):
# measured figures in the run's summary page and in an artifact,
# ci-report-<job>. Reports never fail a job for a figure. Every job reports
# where its time went and, where it has a persistent target directory, that
# directory's size; fmt adds dependency freshness and RustSec advisories, and
# the Cassandra job per-operation latency and binary sizes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Each job's last report reads its own step timings from the Actions API
  # (.github/scripts/job-step-timings.py). Read-only, like contents.
  actions: read

# One run per ref; a newer push supersedes the run in flight.
concurrency:
  group: fmt-clippy-cassandra-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by environment, which rustup ranks above any directory override left
  # on the runner (the inherited ci.yml hit exactly that). Cargo itself refuses
  # a toolchain older than the workspace rust-version, 1.91.1.
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    # Fork guard (ADR-aacruzgon-0018). It only keeps this unmodified workflow
    # from running a fork's code; approval is what keeps forks off the runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hfs-cassandra-light]
    timeout-minutes: 10
    env:
      # The commit and build profile the CI reports name (ci-report.py
      # context): on a pull request, its head, not the merge commit
      # GITHUB_SHA names. fmt builds nothing.
      CI_REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_REPORT_PROFILE: none (rustfmt and reports only)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config, where build scripts and
          # proc-macros run by cargo could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      # The CI half of the dependency rule (check a dependency's newer
      # releases before working around its bug): each chosen crate's locked
      # version against crates.io's newest, one request a second with a
      # descriptive User-Agent (https://crates.io/data-access). Here because
      # fmt is the cheapest job and builds nothing. Report only: a major
      # version behind is a warning annotation.
      - name: Report dependency freshness
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          out="$RUNNER_TEMP/ci-report-inputs/dependency-freshness"
          python3 .github/scripts/dependency-freshness.py "$out"
          python3 .github/scripts/ci-report.py add dependency-freshness "Dependency freshness" \
            --markdown "$out/dependency-freshness.md" --json "$out/dependency-freshness.json"

      # RustSec advisories for Cargo.lock, with cargo-audit 0.22.2 (the newest
      # release on 2026-11-06), downloaded once per runner into its tool cache
      # and checked against the release asset's SHA-256, rather than built.
      # Report only: a vulnerability audit.toml does not acknowledge is a
      # warning annotation.
      - name: Report RustSec advisories (cargo audit)
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          CARGO_AUDIT_VERSION: 0.22.2
          CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          [ "$(uname -m)" = x86_64 ] || { echo "cargo audit report: no pinned binary for $(uname -m)"; exit 0; }
          dir="${RUNNER_TOOL_CACHE:?}/cargo-audit/$CARGO_AUDIT_VERSION"
          if [ ! -x "$dir/cargo-audit" ]; then
            name="cargo-audit-x86_64-unknown-linux-musl-v$CARGO_AUDIT_VERSION"
            tmp=$(mktemp -d)
            curl -sSfL --retry 3 -o "$tmp/$name.tgz" \
              "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v$CARGO_AUDIT_VERSION/$name.tgz"
            echo "$CARGO_AUDIT_SHA256  $tmp/$name.tgz" | sha256sum -c -
            tar -xzf "$tmp/$name.tgz" -C "$tmp"
            mkdir -p "$dir" && mv "$tmp/$name/cargo-audit" "$dir/cargo-audit"
            rm -rf "$tmp"
          fi
          out="$RUNNER_TEMP/ci-report-inputs/cargo-audit"
          CARGO_AUDIT="$dir/cargo-audit" python3 .github/scripts/cargo-audit-report.py "$out"
          python3 .github/scripts/ci-report.py add cargo-audit "RustSec advisories (cargo audit)" \
            --markdown "$out/cargo-audit.md" --json "$out/cargo-audit.json"

      # Where this job's time went (.github/scripts/job-step-timings.py): each
      # finished step's duration, read from the Actions API with this job's
      # token, which the workflow's `actions: read` allows. Steps after this
      # one are not finished, so they are listed untimed. Report only.
      - name: Report where this job's time went
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/ci-report-inputs/step-timings"
          python3 .github/scripts/job-step-timings.py "cargo fmt --check" "$out"
          python3 .github/scripts/ci-report.py add step-timings "Where this job's time went" \
            --markdown "$out/step-timings.md" --json "$out/step-timings.json"

      # Every report section of this job (.github/scripts/ci-report.py), as
      # JSON and Markdown, plus the raw outputs they were read from. Report
      # only: an upload failure does not fail the job.
      - name: Upload the CI report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-fmt
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: warn
          overwrite: true

  # Clippy is the CONTRIBUTING.md command split in two (ADR-sam-michaels-0003).
  # With --all-features, helios-fhir holds all four FHIR versions, and its lib
  # and lib-test units need about 12.8 GB each. In one command cargo builds
  # them side by side, past the runner service's MemoryMax=20G. So helios-fhir
  # is checked alone, one unit at a time, and the rest of the workspace after
  # it, with helios-fhir only as a dependency. Together the two jobs lint the
  # same crates and targets as the CONTRIBUTING.md command, with the same lint
  # flags, at low priority because the runner is also Sam's desktop.
  clippy-fhir:
    name: cargo clippy (helios-fhir)
    # Fork guard (ADR-aacruzgon-0018).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hfs-cassandra-heavy]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy

      # Same bounded, persistent target directory as r4b-compile-check.yml
      # (ADR-sam-michaels-0002). Both clippy jobs share it, under the ~30 GB
      # cap that ADR records for clippy; they never run at the same time.
      - name: Reset the target dir if it is stale or over its cap
        env:
          TARGET_DIR: ${{ runner.workspace }}/target/clippy
          CAP_GB: 30
        run: |
          stamp="$(rustc -V) $(sha256sum Cargo.lock | cut -c1-16)"
          # One du, in bytes; size_gb rounds up, as du --block-size=1G does.
          before_bytes=$(du -s --block-size=1 "$TARGET_DIR" 2>/dev/null | cut -f1)
          size_gb=$(( (${before_bytes:-0} + 1073741823) / 1073741824 ))
          old_stamp=$(cat "$TARGET_DIR/.stamp" 2>/dev/null || true)
          reset=no reason=
          if [ "$old_stamp" != "$stamp" ] || [ "$size_gb" -gt "$CAP_GB" ]; then
            if [ -z "$old_stamp" ]; then reason="no stamp: a new or emptied directory"
            elif [ "$old_stamp" != "$stamp" ]; then reason="stamp changed: the toolchain or Cargo.lock"
            else reason="$size_gb GB, over the $CAP_GB GB cap"; fi
            reset=yes
            echo "Resetting $TARGET_DIR (size $size_gb GB, cap $CAP_GB GB, stamp: $stamp; $reason)"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR" && echo "$stamp" > "$TARGET_DIR/.stamp"
          echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          # For the build-size report (.github/scripts/build-size-report.py).
          {
            echo "TARGET_DIR_BEFORE_BYTES=${before_bytes:-0}"
            echo "TARGET_DIR_RESET=$reset"
            echo "TARGET_DIR_RESET_REASON=$reason"
            echo "TARGET_DIR_CAP_GB=$CAP_GB"
          } >> "$GITHUB_ENV"

      # Wrapped in ci-report.py build, which samples the runner's cgroup every
      # second and reports the wall time and the memory peaks
      # (ADR-aacruzgon-0023, ADR-sam-michaels-0003). It exits with clippy's
      # status.
      - name: cargo clippy -p helios-fhir --all-targets --all-features, one job at a time
        env:
          CARGO_BUILD_JOBS: 1
          CI_REPORT_PROFILE: clippy (dev profile, check only)
          # The commit the CI reports name: on a pull request, its head, not
          # the merge commit GITHUB_SHA names.
          CI_REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/ci-report.py build build-clippy-fhir "Build: cargo clippy (helios-fhir)" -- \
          nice -n 10 cargo clippy -p helios-fhir --all-targets --all-features -- -D warnings \
              -A clippy::items_after_test_module \
              -A clippy::large_enum_variant \
              -A clippy::question_mark \
              -A clippy::collapsible_match \
              -A clippy::collapsible_if \
              -A clippy::field_reassign_with_default \
              -A clippy::doc-overindented-list-items \
              -A clippy::doc-lazy-continuation

      # The persistent target directory before and after this job, and
      # whether the reset step reset it and why
      # (.github/scripts/build-size-report.py). Report only.
      - name: Report the target directory's size
        if: always()
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/ci-report-inputs/build-size"
          python3 .github/scripts/build-size-report.py "$out"
          python3 .github/scripts/ci-report.py add build-size "Target directory size" \
            --markdown "$out/build-size.md" --json "$out/build-size.json"

      # Where this job's time went (.github/scripts/job-step-timings.py): each
      # finished step's duration, read from the Actions API with this job's
      # token, which the workflow's `actions: read` allows. Steps after this
      # one are not finished, so they are listed untimed. Report only.
      - name: Report where this job's time went
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/ci-report-inputs/step-timings"
          python3 .github/scripts/job-step-timings.py "cargo clippy (helios-fhir)" "$out"
          python3 .github/scripts/ci-report.py add step-timings "Where this job's time went" \
            --markdown "$out/step-timings.md" --json "$out/step-timings.json"

      # Every report section of this job (.github/scripts/ci-report.py), as
      # JSON and Markdown, plus the raw outputs they were read from. Report
      # only: an upload failure does not fail the job.
      - name: Upload the CI report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-clippy-fhir
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: warn
          overwrite: true

  clippy-workspace:
    name: cargo clippy (workspace)
    # Runs only after helios-fhir passes: the order is what keeps the two
    # 12.8 GB helios-fhir units apart. If clippy-fhir fails, this job is
    # skipped, so both job names must be required checks (ADR-aacruzgon-0019).
    needs: clippy-fhir
    # Fork guard (ADR-aacruzgon-0018).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hfs-cassandra-heavy]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy

      # Same bounded, persistent target directory as r4b-compile-check.yml
      # (ADR-sam-michaels-0002). Both clippy jobs share it, under the ~30 GB
      # cap that ADR records for clippy; they never run at the same time.
      - name: Reset the target dir if it is stale or over its cap
        env:
          TARGET_DIR: ${{ runner.workspace }}/target/clippy
          CAP_GB: 30
        run: |
          stamp="$(rustc -V) $(sha256sum Cargo.lock | cut -c1-16)"
          # One du, in bytes; size_gb rounds up, as du --block-size=1G does.
          before_bytes=$(du -s --block-size=1 "$TARGET_DIR" 2>/dev/null | cut -f1)
          size_gb=$(( (${before_bytes:-0} + 1073741823) / 1073741824 ))
          old_stamp=$(cat "$TARGET_DIR/.stamp" 2>/dev/null || true)
          reset=no reason=
          if [ "$old_stamp" != "$stamp" ] || [ "$size_gb" -gt "$CAP_GB" ]; then
            if [ -z "$old_stamp" ]; then reason="no stamp: a new or emptied directory"
            elif [ "$old_stamp" != "$stamp" ]; then reason="stamp changed: the toolchain or Cargo.lock"
            else reason="$size_gb GB, over the $CAP_GB GB cap"; fi
            reset=yes
            echo "Resetting $TARGET_DIR (size $size_gb GB, cap $CAP_GB GB, stamp: $stamp; $reason)"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR" && echo "$stamp" > "$TARGET_DIR/.stamp"
          echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          # For the build-size report (.github/scripts/build-size-report.py).
          {
            echo "TARGET_DIR_BEFORE_BYTES=${before_bytes:-0}"
            echo "TARGET_DIR_RESET=$reset"
            echo "TARGET_DIR_RESET_REASON=$reason"
            echo "TARGET_DIR_CAP_GB=$CAP_GB"
          } >> "$GITHUB_ENV"

      # helios-fhir is built here once, as a dependency, never its test target.
      # helios-fhir/skip-r6-download gives it the same features as the
      # CONTRIBUTING.md command (R4, R4B, R5, R6, xml, skip-r6-download);
      # without it, helios-fhir's build script downloads R6 examples from
      # build.fhir.org, because an excluded package gets no --all-features.
      # Wrapped in ci-report.py build, as in clippy-fhir.
      - name: cargo clippy --workspace --exclude helios-fhir --all-targets --all-features
        env:
          CARGO_BUILD_JOBS: 8
          CI_REPORT_PROFILE: clippy (dev profile, check only)
          # The commit the CI reports name: on a pull request, its head, not
          # the merge commit GITHUB_SHA names.
          CI_REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/ci-report.py build build-clippy-workspace "Build: cargo clippy (workspace)" -- \
          nice -n 10 cargo clippy --workspace --exclude helios-fhir --all-targets --all-features \
            --features helios-fhir/skip-r6-download -- -D warnings \
              -A clippy::items_after_test_module \
              -A clippy::large_enum_variant \
              -A clippy::question_mark \
              -A clippy::collapsible_match \
              -A clippy::collapsible_if \
              -A clippy::field_reassign_with_default \
              -A clippy::doc-overindented-list-items \
              -A clippy::doc-lazy-continuation

      # The persistent target directory before and after this job, and
      # whether the reset step reset it and why
      # (.github/scripts/build-size-report.py). Report only.
      - name: Report the target directory's size
        if: always()
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/ci-report-inputs/build-size"
          python3 .github/scripts/build-size-report.py "$out"
          python3 .github/scripts/ci-report.py add build-size "Target directory size" \
            --markdown "$out/build-size.md" --json "$out/build-size.json"

      # Where this job's time went (.github/scripts/job-step-timings.py): each
      # finished step's duration, read from the Actions API with this job's
      # token, which the workflow's `actions: read` allows. Steps after this
      # one are not finished, so they are listed untimed. Report only.
      - name: Report where this job's time went
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/ci-report-inputs/step-timings"
          python3 .github/scripts/job-step-timings.py "cargo clippy (workspace)" "$out"
          python3 .github/scripts/ci-report.py add step-timings "Where this job's time went" \
            --markdown "$out/step-timings.md" --json "$out/step-timings.json"

      # Every report section of this job (.github/scripts/ci-report.py), as
      # JSON and Markdown, plus the raw outputs they were read from. Report
      # only: an upload failure does not fail the job.
      - name: Upload the CI report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-clippy-workspace
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: warn
          overwrite: true

  # The job name is a required check (ADR-aacruzgon-0021): it stays
  # "Cassandra schema (single node)" although the job also runs
  # tests/cassandra_tests.rs and tests/backend_capability_contract.rs against
  # its node (ADR-aacruzgon-0020).
  cassandra:
    name: Cassandra schema (single node)
    # Fork guard (ADR-aacruzgon-0018).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hfs-cassandra-light]
    # A cold build of the test binary takes a few minutes; warm, seconds.
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker/cassandra/docker-compose.yml
      # CI's own host port, never the default 59042 that a developer's
      # Cassandra uses (ADR-sam-michaels-0001). Every compose command below
      # also names CI's own project, hfs-cassandra-ci, so down -v can only
      # ever remove CI's containers and volume.
      CASSANDRA_HOST_PORT: 59142
      # No incremental cache in the persistent target dir below: it would grow
      # with every commit until the size cap wipes the whole directory.
      CARGO_INCREMENTAL: 0
      # The build profile and the commit the CI reports name (ci-report.py
      # context): on a pull request, its head, not the merge commit
      # GITHUB_SHA names.
      CI_REPORT_PROFILE: dev (debug, CARGO_INCREMENTAL=0)
      CI_REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable

      # Same bounded, persistent target directory as r4b-compile-check.yml
      # (ADR-sam-michaels-0002), one per runner.
      - name: Reset the target dir if it is stale or over its cap
        env:
          TARGET_DIR: ${{ runner.workspace }}/target/cassandra-tests
          CAP_GB: 15
        run: |
          stamp="$(rustc -V) $(sha256sum Cargo.lock | cut -c1-16)"
          # One du, in bytes; size_gb rounds up, as du --block-size=1G does.
          before_bytes=$(du -s --block-size=1 "$TARGET_DIR" 2>/dev/null | cut -f1)
          size_gb=$(( (${before_bytes:-0} + 1073741823) / 1073741824 ))
          old_stamp=$(cat "$TARGET_DIR/.stamp" 2>/dev/null || true)
          reset=no reason=
          if [ "$old_stamp" != "$stamp" ] || [ "$size_gb" -gt "$CAP_GB" ]; then
            if [ -z "$old_stamp" ]; then reason="no stamp: a new or emptied directory"
            elif [ "$old_stamp" != "$stamp" ]; then reason="stamp changed: the toolchain or Cargo.lock"
            else reason="$size_gb GB, over the $CAP_GB GB cap"; fi
            reset=yes
            echo "Resetting $TARGET_DIR (size $size_gb GB, cap $CAP_GB GB, stamp: $stamp; $reason)"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR" && echo "$stamp" > "$TARGET_DIR/.stamp"
          echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          # For the build-size report (.github/scripts/build-size-report.py).
          {
            echo "TARGET_DIR_BEFORE_BYTES=${before_bytes:-0}"
            echo "TARGET_DIR_RESET=$reset"
            echo "TARGET_DIR_RESET_REASON=$reason"
            echo "TARGET_DIR_CAP_GB=$CAP_GB"
          } >> "$GITHUB_ENV"

      # Built before Cassandra starts, so the build's memory peak and the
      # 3 GiB container never overlap. acruzdebian caps its runner service at
      # 9 GiB (ADR-aacruzgon-0023), so each build runs under ci-report.py
      # build, which samples the runner's cgroup every second and reports two
      # peaks: memory.current, page cache included, which reaches the cap
      # whenever the cache fills it; and memory.stat's anon, the memory the
      # kernel cannot reclaim, which is the one that must stay under the cap.
      # It also reports the OOM kills during the build and the wall time, on
      # a failed build too, and exits with cargo's status.
      # nice, as for clippy: sam-7900x is also Sam's desktop.
      # The Milestone A test (crates/hfs/tests/cassandra_milestone_a.rs) is
      # built here too: hfs with only the cassandra backend, and the test
      # binary that starts it.
      - name: Build tests/cassandra_tests.rs, backend_capability_contract.rs and the Milestone A test, and report the memory peak
        id: build
        run: |
          python3 .github/scripts/ci-report.py build build-persistence-tests \
            "Build: helios-persistence Cassandra tests" -- \
            nice -n 10 cargo test -p helios-persistence --features cassandra \
              --test cassandra_tests --test backend_capability_contract --no-run
          python3 .github/scripts/ci-report.py build build-hfs-milestone-a \
            "Build: hfs (R4, cassandra) and the Milestone A test" -- \
            nice -n 10 cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a --no-run

      # A run killed mid-job (cancelled, runner restarted) skips its cleanup.
      - name: Remove leftovers of an earlier run
        run: docker compose -p hfs-cassandra-ci down -v --remove-orphans

      # First boot takes about 60 s; the healthcheck allows a 90 s start
      # period and then 12 retries 10 s apart.
      - name: Start Cassandra and wait for its healthcheck
        run: |
          start=$(date +%s)
          docker compose -p hfs-cassandra-ci up -d --wait --wait-timeout 240
          echo "Healthy after $(( $(date +%s) - start )) s"

      # The context every later report section carries, now with the node's
      # Cassandra version. Report only.
      - name: Report the context
        continue-on-error: true
        run: python3 .github/scripts/ci-report.py context --cassandra-container hfs-cassandra-ci-cassandra-1

      - name: Apply keyspace-single-node.cql, then schema.cql
        run: |
          cqlsh --connect-timeout 30 --request-timeout 60 127.0.0.1 "$CASSANDRA_HOST_PORT" \
            -f docs/Cassandra/schema/keyspace-single-node.cql
          cqlsh --connect-timeout 30 --request-timeout 60 127.0.0.1 "$CASSANDRA_HOST_PORT" \
            -k helios -f docs/Cassandra/schema/schema.cql

      # docs/Cassandra/schema/README.md: every statement is IF NOT EXISTS, so a
      # second apply is silent, and the keyspace holds the design's ten tables.
      - name: Check the schema re-applies silently and has ten tables
        run: |
          out=$(cqlsh 127.0.0.1 "$CASSANDRA_HOST_PORT" -k helios -f docs/Cassandra/schema/schema.cql 2>&1 \
            | grep -v 'cqlsh was built against' || true)
          if [ -n "$out" ]; then echo "Re-applying schema.cql printed:"; echo "$out"; exit 1; fi
          tables=$(cqlsh 127.0.0.1 "$CASSANDRA_HOST_PORT" -e \
            "SELECT table_name FROM system_schema.tables WHERE keyspace_name = 'helios'" 2>/dev/null \
            | awk 'NF == 1 && $1 !~ /^(table_name|-+)$/')
          echo "$tables"
          [ "$(echo "$tables" | wc -l)" -eq 10 ]

      # What the design relies on, read back from system_schema and compared
      # with docs/Cassandra/schema/expected-schema.txt (ADR-aacruzgon-0026):
      # every table and column, each key column's kind and position, each
      # clustering column's order, and gc_grace_seconds, default_time_to_live
      # and the compaction class and scaling parameters (ADR-aacruzgon-0009,
      # 0010). Each query's rows are trimmed, joined by single spaces and
      # sorted bytewise (LC_ALL=C), so the comparison depends on neither cqlsh's
      # column padding nor the runner's locale.
      # After a deliberate change to schema.cql, regenerate the file with this
      # same function and review the diff with the change.
      - name: Check tables, keys, clustering order and options against the design
        run: |
          q() {
            cqlsh 127.0.0.1 "$CASSANDRA_HOST_PORT" -e "$1" 2>/dev/null \
              | awk -F'|' 'NF > 1 && !/^-/ { out = ""; for (i = 1; i <= NF; i++) { gsub(/^ +| +$/, "", $i); out = out (i > 1 ? " " : "") $i }; print out }' \
              | tail -n +2 | LC_ALL=C sort
          }
          actual="$RUNNER_TEMP/actual-schema.txt"
          {
            echo "# columns: table column kind position clustering_order type"
            q "SELECT table_name, column_name, kind, position, clustering_order, type FROM system_schema.columns WHERE keyspace_name = 'helios'"
            echo "# options: table gc_grace_seconds default_time_to_live compaction_class scaling_parameters"
            q "SELECT table_name, gc_grace_seconds, default_time_to_live, compaction['class'], compaction['scaling_parameters'] FROM system_schema.tables WHERE keyspace_name = 'helios'"
          } > "$actual"
          diff -u docs/Cassandra/schema/expected-schema.txt "$actual"
          echo "schema matches docs/Cassandra/schema/expected-schema.txt ($(grep -vc '^#' "$actual") rows)"

      # ADR-aacruzgon-0020, Rule 1: the tests use this job's node, with the
      # schema just applied, through its published port, as cqlsh does above.
      # Already built, so this step only runs the two binaries. The capability
      # contract's Cassandra instance tests skip without the variable, so they
      # run only here.
      # Each test step keeps its output in the report directory, and
      # --show-output prints each passing test's captured output, so the test
      # report can name every live test that printed a skip.
      - name: cargo test --test cassandra_tests --test backend_capability_contract against this node
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-report/logs"
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
            cargo test -p helios-persistence --features cassandra \
              --test cassandra_tests --test backend_capability_contract -- --show-output 2>&1 \
            | tee "$RUNNER_TEMP/ci-report/logs/persistence-tests.log"

      # Milestone A (roadmap Step 2, item 2.7): the real hfs binary on this
      # node, POST /Patient then GET /Patient/{id}. Built above.
      - name: Milestone A round trip through hfs against this node
        id: round-trip
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-report/logs"
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
            cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a -- --exact milestone_a_create_then_read_through_rest \
              --show-output 2>&1 \
            | tee "$RUNNER_TEMP/ci-report/logs/milestone-a-round-trip.log"

      # Roadmap item 2.6: three boots of hfs with the conformance seed, each on
      # a fresh tenant, then a warm boot, against this node. Report only: a
      # seed over the provisional 10 s budget (roadmap section 7) is a
      # warning annotation; the step fails only if hfs does not boot or a log
      # line the measurement needs is missing. Already built. A failure here
      # does not skip the readiness test: that one runs when the round trip
      # passed. Four boots take well under a minute; the timeout bounds a hung
      # node.
      - name: Boot-time report against this node (report only)
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-report/logs"
          dir="$RUNNER_TEMP/ci-report/boot-time"
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" HFS_TEST_BOOT_REPORT="$dir" \
            cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a -- --exact boot_time_report --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/ci-report/logs/boot-time.log"
          python3 .github/scripts/ci-report.py add boot-time \
            "Boot time and conformance seed (roadmap item 2.6)" \
            --markdown "$dir/boot-time.md" --json "$dir/boot-time.json"

      # Per-operation latency, a smoke trend: single node, debug build, not the
      # Step 8 benchmark. 200 creates, 200 reads and 20 counts through
      # CassandraBackend, then 50 POST + GET round trips through hfs, each on
      # a fresh tenant (ADR-aacruzgon-0020). Already built; about 12 s. Report
      # only: no figure fails it; it fails only if an operation fails. Before
      # the node statistics, so they include its writes, and before the
      # readiness test, which stays last.
      - name: Latency report against this node (report only)
        if: ${{ !cancelled() && steps.round-trip.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-report/logs"
          logs="$RUNNER_TEMP/ci-report/logs"
          dir="$RUNNER_TEMP/ci-report-inputs/latency"
          export HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" HFS_TEST_LATENCY_REPORT="$dir"
          status=0
          cargo test -p helios-persistence --features cassandra --test cassandra_tests \
            -- --exact latency_report::cassandra_latency_report --nocapture 2>&1 \
            | tee "$logs/latency-backend.log" || status=1
          cargo test -p helios-hfs --no-default-features --features R4,cassandra \
            --test cassandra_milestone_a -- --exact rest_latency_report --nocapture 2>&1 \
            | tee "$logs/latency-rest.log" || status=1
          python3 .github/scripts/ci-report.py add latency-backend \
            "Latency: CassandraBackend create, read and count (smoke trend)" \
            --markdown "$dir/cassandra-latency.md" --json "$dir/cassandra-latency.json"
          python3 .github/scripts/ci-report.py add latency-rest \
            "Latency: POST and GET through hfs (smoke trend)" \
            --markdown "$dir/hfs-rest-latency.md" --json "$dir/hfs-rest-latency.json"
          exit "$status"

      # Before the readiness test, which restarts the node and so resets these
      # metrics: tablestats, tpstats, the per-table latency and tombstone
      # histograms of system_views, and the lightweight-transaction counts,
      # after everything the tests and the boot report wrote. Report only.
      - name: Report the node's statistics
        if: ${{ !cancelled() && steps.round-trip.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: python3 .github/scripts/ci-report.py node-stats node-stats "Cassandra node statistics" hfs-cassandra-ci-cassandra-1

      # Step 2's exit criterion: /_readiness reports down while Cassandra is
      # stopped, and up once it is back. The test stops and starts this job's
      # own node, named by HFS_TEST_CASSANDRA_STOPPABLE_CONTAINER (the opt-in;
      # the test checks the container publishes the URL's port), so it is the
      # job's last test step. --nocapture prints the down and up times. It
      # runs whenever the round trip passed, so a failed boot-time report or
      # node snapshot (both report steps) does not hide the exit criterion;
      # that failure still fails the job.
      - name: Milestone A readiness, stopping and starting this job's node (last test step)
        if: ${{ !cancelled() && steps.round-trip.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-report/logs"
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
          HFS_TEST_CASSANDRA_STOPPABLE_CONTAINER=hfs-cassandra-ci-cassandra-1 \
            cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a -- --exact readiness_reports_down_while_cassandra_is_stopped \
              --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/ci-report/logs/readiness.log"

      # Written after the last test step, whatever its result: the test counts
      # and skips of every test step, and the readiness test's recovery times.
      # Report only.
      - name: Report the tests and the readiness recovery
        if: always()
        continue-on-error: true
        run: |
          logs="$RUNNER_TEMP/ci-report/logs"
          python3 .github/scripts/ci-report.py tests tests "Tests" \
            "$logs/persistence-tests.log" "$logs/milestone-a-round-trip.log" \
            "$logs/boot-time.log" "$logs/latency-backend.log" "$logs/latency-rest.log" \
            "$logs/readiness.log"
          python3 .github/scripts/ci-report.py readiness readiness \
            "Readiness recovery (Step 2 exit criterion)" "$logs/readiness.log"

      - name: Cassandra logs
        if: failure()
        run: docker compose -p hfs-cassandra-ci logs --tail 200

      # down -v is safe here only because -p names CI's own project.
      - name: Stop Cassandra and remove CI's volume
        if: always()
        run: docker compose -p hfs-cassandra-ci down -v --remove-orphans

      # The target directory before and after, whether the reset step reset
      # it, and the size of every binary the build step made: its two cargo
      # commands again with --message-format=json, a no-op that lists the
      # executables it already built (.github/scripts/build-size-report.py).
      # Report only.
      - name: Report the target directory's and the binaries' sizes
        if: always()
        continue-on-error: true
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          out="$RUNNER_TEMP/ci-report-inputs/build-size"
          mkdir -p "$out"
          set --
          if [ "$BUILD_OUTCOME" = success ]; then
            cargo test -p helios-persistence --features cassandra \
              --test cassandra_tests --test backend_capability_contract --no-run \
              --message-format=json > "$out/persistence-artifacts.json"
            cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a --no-run --message-format=json > "$out/hfs-artifacts.json"
            set -- "@$out/persistence-artifacts.json" "@$out/hfs-artifacts.json"
          fi
          python3 .github/scripts/build-size-report.py "$out" "$@"
          python3 .github/scripts/ci-report.py add build-size "Target directory and binary sizes" \
            --markdown "$out/build-size.md" --json "$out/build-size.json"

      # Where this job's time went (.github/scripts/job-step-timings.py): each
      # finished step's duration, read from the Actions API with this job's
      # token, which the workflow's `actions: read` allows. Steps after this
      # one are not finished, so they are listed untimed. Report only.
      - name: Report where this job's time went
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/ci-report-inputs/step-timings"
          python3 .github/scripts/job-step-timings.py "Cassandra schema (single node)" "$out"
          python3 .github/scripts/ci-report.py add step-timings "Where this job's time went" \
            --markdown "$out/step-timings.md" --json "$out/step-timings.json"

      # Every report section of this job (.github/scripts/ci-report.py), as
      # JSON and Markdown, plus the raw outputs they were read from. Report
      # only: an upload failure does not fail the job.
      - name: Upload the CI report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-cassandra
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: warn
          overwrite: true
