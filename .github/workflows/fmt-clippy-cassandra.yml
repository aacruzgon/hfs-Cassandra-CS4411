name: fmt, clippy and Cassandra schema

# Roadmap item 0.5 on the team's self-hosted runner (ADR-aacruzgon-0018,
# ADR-sam-michaels-0001): rustfmt, the CONTRIBUTING.md clippy command split
# into two jobs, and a single-node Cassandra that the schema is applied to and
# tests/cassandra_tests.rs and tests/backend_capability_contract.rs run
# against (ADR-aacruzgon-0020).
# fmt and the Cassandra job are light and run on either runner; the clippy
# pair is heavy and runs only on sam-7900x (ADR-aacruzgon-0023). Each runner
# has one executor, so the jobs on one machine run one after another.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push supersedes the run in flight.
concurrency:
  group: fmt-clippy-cassandra-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by environment, which rustup ranks above any directory override left
  # on the runner (the inherited ci.yml hit exactly that). Cargo itself refuses
  # a toolchain older than the workspace rust-version, 1.91.1.
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    # Fork guard (ADR-aacruzgon-0018). It only keeps this unmodified workflow
    # from running a fork's code; approval is what keeps forks off the runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hfs-cassandra-light]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config, where build scripts and
          # proc-macros run by cargo could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  # Clippy is the CONTRIBUTING.md command split in two (ADR-sam-michaels-0003).
  # With --all-features, helios-fhir holds all four FHIR versions, and its lib
  # and lib-test units need about 12.8 GB each. In one command cargo builds
  # them side by side, past the runner service's MemoryMax=20G. So helios-fhir
  # is checked alone, one unit at a time, and the rest of the workspace after
  # it, with helios-fhir only as a dependency. Together the two jobs lint the
  # same crates and targets as the CONTRIBUTING.md command, with the same lint
  # flags, at low priority because the runner is also Sam's desktop.
  clippy-fhir:
    name: cargo clippy (helios-fhir)
    # Fork guard (ADR-aacruzgon-0018).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hfs-cassandra-heavy]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy

      # Same bounded, persistent target directory as r4b-compile-check.yml
      # (ADR-sam-michaels-0002). Both clippy jobs share it, under the ~30 GB
      # cap that ADR records for clippy; they never run at the same time.
      - name: Reset the target dir if it is stale or over its cap
        env:
          TARGET_DIR: ${{ runner.workspace }}/target/clippy
          CAP_GB: 30
        run: |
          stamp="$(rustc -V) $(sha256sum Cargo.lock | cut -c1-16)"
          size_gb=$(du -s --block-size=1G "$TARGET_DIR" 2>/dev/null | cut -f1)
          if [ "$(cat "$TARGET_DIR/.stamp" 2>/dev/null)" != "$stamp" ] || [ "${size_gb:-0}" -gt "$CAP_GB" ]; then
            echo "Resetting $TARGET_DIR (size ${size_gb:-0} GB, cap $CAP_GB GB, stamp: $stamp)"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR" && echo "$stamp" > "$TARGET_DIR/.stamp"
          echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

      - name: cargo clippy -p helios-fhir --all-targets --all-features, one job at a time
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          nice -n 10 cargo clippy -p helios-fhir --all-targets --all-features -- -D warnings \
              -A clippy::items_after_test_module \
              -A clippy::large_enum_variant \
              -A clippy::question_mark \
              -A clippy::collapsible_match \
              -A clippy::collapsible_if \
              -A clippy::field_reassign_with_default \
              -A clippy::doc-overindented-list-items \
              -A clippy::doc-lazy-continuation

  clippy-workspace:
    name: cargo clippy (workspace)
    # Runs only after helios-fhir passes: the order is what keeps the two
    # 12.8 GB helios-fhir units apart. If clippy-fhir fails, this job is
    # skipped, so both job names must be required checks (ADR-aacruzgon-0019).
    needs: clippy-fhir
    # Fork guard (ADR-aacruzgon-0018).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hfs-cassandra-heavy]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy

      # Same bounded, persistent target directory as r4b-compile-check.yml
      # (ADR-sam-michaels-0002). Both clippy jobs share it, under the ~30 GB
      # cap that ADR records for clippy; they never run at the same time.
      - name: Reset the target dir if it is stale or over its cap
        env:
          TARGET_DIR: ${{ runner.workspace }}/target/clippy
          CAP_GB: 30
        run: |
          stamp="$(rustc -V) $(sha256sum Cargo.lock | cut -c1-16)"
          size_gb=$(du -s --block-size=1G "$TARGET_DIR" 2>/dev/null | cut -f1)
          if [ "$(cat "$TARGET_DIR/.stamp" 2>/dev/null)" != "$stamp" ] || [ "${size_gb:-0}" -gt "$CAP_GB" ]; then
            echo "Resetting $TARGET_DIR (size ${size_gb:-0} GB, cap $CAP_GB GB, stamp: $stamp)"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR" && echo "$stamp" > "$TARGET_DIR/.stamp"
          echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

      # helios-fhir is built here once, as a dependency, never its test target.
      # helios-fhir/skip-r6-download gives it the same features as the
      # CONTRIBUTING.md command (R4, R4B, R5, R6, xml, skip-r6-download);
      # without it, helios-fhir's build script downloads R6 examples from
      # build.fhir.org, because an excluded package gets no --all-features.
      - name: cargo clippy --workspace --exclude helios-fhir --all-targets --all-features
        env:
          CARGO_BUILD_JOBS: 8
        run: |
          nice -n 10 cargo clippy --workspace --exclude helios-fhir --all-targets --all-features \
            --features helios-fhir/skip-r6-download -- -D warnings \
              -A clippy::items_after_test_module \
              -A clippy::large_enum_variant \
              -A clippy::question_mark \
              -A clippy::collapsible_match \
              -A clippy::collapsible_if \
              -A clippy::field_reassign_with_default \
              -A clippy::doc-overindented-list-items \
              -A clippy::doc-lazy-continuation

  # The job name is a required check (ADR-aacruzgon-0021): it stays
  # "Cassandra schema (single node)" although the job also runs
  # tests/cassandra_tests.rs and tests/backend_capability_contract.rs against
  # its node (ADR-aacruzgon-0020).
  cassandra:
    name: Cassandra schema (single node)
    # Fork guard (ADR-aacruzgon-0018).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hfs-cassandra-light]
    # A cold build of the test binary takes a few minutes; warm, seconds.
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker/cassandra/docker-compose.yml
      # CI's own host port, never the default 59042 that a developer's
      # Cassandra uses (ADR-sam-michaels-0001). Every compose command below
      # also names CI's own project, hfs-cassandra-ci, so down -v can only
      # ever remove CI's containers and volume.
      CASSANDRA_HOST_PORT: 59142
      # No incremental cache in the persistent target dir below: it would grow
      # with every commit until the size cap wipes the whole directory.
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable

      # Same bounded, persistent target directory as r4b-compile-check.yml
      # (ADR-sam-michaels-0002), one per runner.
      - name: Reset the target dir if it is stale or over its cap
        env:
          TARGET_DIR: ${{ runner.workspace }}/target/cassandra-tests
          CAP_GB: 15
        run: |
          stamp="$(rustc -V) $(sha256sum Cargo.lock | cut -c1-16)"
          size_gb=$(du -s --block-size=1G "$TARGET_DIR" 2>/dev/null | cut -f1)
          if [ "$(cat "$TARGET_DIR/.stamp" 2>/dev/null)" != "$stamp" ] || [ "${size_gb:-0}" -gt "$CAP_GB" ]; then
            echo "Resetting $TARGET_DIR (size ${size_gb:-0} GB, cap $CAP_GB GB, stamp: $stamp)"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR" && echo "$stamp" > "$TARGET_DIR/.stamp"
          echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

      # Built before Cassandra starts, so the build's memory peak and the
      # 3 GiB container never overlap. acruzdebian caps its runner service at
      # 9 GiB (ADR-aacruzgon-0023), so the step samples the runner's cgroup
      # every second and prints two peaks: memory.current, page cache
      # included, which reaches the cap whenever the cache fills it; and
      # memory.stat's anon, the memory the kernel cannot reclaim, which is
      # the one that must stay under the cap. It also prints how many OOM
      # kills the cgroup had during the build. The EXIT trap stops the
      # sampler and prints all of it on a failed build too.
      # nice, as for clippy: sam-7900x is also Sam's desktop.
      # The Milestone A test (crates/hfs/tests/cassandra_milestone_a.rs) is
      # built here too, so the sampler covers it: hfs with only the cassandra
      # backend, and the test binary that starts it.
      - name: Build tests/cassandra_tests.rs, backend_capability_contract.rs and the Milestone A test, and print the memory peak
        run: |
          cgroup="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          peaks="$RUNNER_TEMP/build-memory-peaks"
          echo "0 0" > "$peaks"
          oom_kills() { awk '$1 == "oom_kill" { print $2 }' "$cgroup/memory.events" 2>/dev/null || echo 0; }
          oom_before=$(oom_kills)
          sampler=
          start=$(date +%s)
          report() {
            if [ -n "$sampler" ]; then kill "$sampler" 2>/dev/null || true; fi
            read -r current anon < "$peaks"
            echo "Build ran $(( $(date +%s) - start )) s on $RUNNER_NAME ($cgroup)." \
              "Peak memory.current: $(( current / 1048576 )) MiB; peak anon: $(( anon / 1048576 )) MiB;" \
              "memory.max: $(cat "$cgroup/memory.max" 2>/dev/null || echo unknown);" \
              "OOM kills during the build: $(( $(oom_kills) - oom_before ))"
          }
          trap report EXIT
          if [ -r "$cgroup/memory.current" ] && [ -r "$cgroup/memory.stat" ]; then
            (
              current_peak=0; anon_peak=0
              while :; do
                current=$(cat "$cgroup/memory.current")
                anon=$(awk '$1 == "anon" { print $2 }' "$cgroup/memory.stat")
                if [ "$current" -gt "$current_peak" ]; then current_peak=$current; fi
                if [ "$anon" -gt "$anon_peak" ]; then anon_peak=$anon; fi
                echo "$current_peak $anon_peak" > "$peaks"
                sleep 1
              done
            ) &
            sampler=$!
          fi
          nice -n 10 cargo test -p helios-persistence --features cassandra \
            --test cassandra_tests --test backend_capability_contract --no-run
          nice -n 10 cargo test -p helios-hfs --no-default-features --features R4,cassandra \
            --test cassandra_milestone_a --no-run

      # A run killed mid-job (cancelled, runner restarted) skips its cleanup.
      - name: Remove leftovers of an earlier run
        run: docker compose -p hfs-cassandra-ci down -v --remove-orphans

      # First boot takes about 60 s; the healthcheck allows a 90 s start
      # period and then 12 retries 10 s apart.
      - name: Start Cassandra and wait for its healthcheck
        run: |
          start=$(date +%s)
          docker compose -p hfs-cassandra-ci up -d --wait --wait-timeout 240
          echo "Healthy after $(( $(date +%s) - start )) s"

      - name: Apply keyspace-single-node.cql, then schema.cql
        run: |
          cqlsh --connect-timeout 30 --request-timeout 60 127.0.0.1 "$CASSANDRA_HOST_PORT" \
            -f docs/Cassandra/schema/keyspace-single-node.cql
          cqlsh --connect-timeout 30 --request-timeout 60 127.0.0.1 "$CASSANDRA_HOST_PORT" \
            -k helios -f docs/Cassandra/schema/schema.cql

      # docs/Cassandra/schema/README.md: every statement is IF NOT EXISTS, so a
      # second apply is silent, and the keyspace holds the design's ten tables.
      - name: Check the schema re-applies silently and has ten tables
        run: |
          out=$(cqlsh 127.0.0.1 "$CASSANDRA_HOST_PORT" -k helios -f docs/Cassandra/schema/schema.cql 2>&1 \
            | grep -v 'cqlsh was built against' || true)
          if [ -n "$out" ]; then echo "Re-applying schema.cql printed:"; echo "$out"; exit 1; fi
          tables=$(cqlsh 127.0.0.1 "$CASSANDRA_HOST_PORT" -e \
            "SELECT table_name FROM system_schema.tables WHERE keyspace_name = 'helios'" 2>/dev/null \
            | awk 'NF == 1 && $1 !~ /^(table_name|-+)$/')
          echo "$tables"
          [ "$(echo "$tables" | wc -l)" -eq 10 ]

      # What the design relies on, read back from system_schema and compared
      # with docs/Cassandra/schema/expected-schema.txt (ADR-aacruzgon-0026):
      # every table and column, each key column's kind and position, each
      # clustering column's order, and gc_grace_seconds, default_time_to_live
      # and the compaction class and scaling parameters (ADR-aacruzgon-0009,
      # 0010). Each query's rows are trimmed, joined by single spaces and
      # sorted bytewise (LC_ALL=C), so the comparison depends on neither cqlsh's
      # column padding nor the runner's locale.
      # After a deliberate change to schema.cql, regenerate the file with this
      # same function and review the diff with the change.
      - name: Check tables, keys, clustering order and options against the design
        run: |
          q() {
            cqlsh 127.0.0.1 "$CASSANDRA_HOST_PORT" -e "$1" 2>/dev/null \
              | awk -F'|' 'NF > 1 && !/^-/ { out = ""; for (i = 1; i <= NF; i++) { gsub(/^ +| +$/, "", $i); out = out (i > 1 ? " " : "") $i }; print out }' \
              | tail -n +2 | LC_ALL=C sort
          }
          actual="$RUNNER_TEMP/actual-schema.txt"
          {
            echo "# columns: table column kind position clustering_order type"
            q "SELECT table_name, column_name, kind, position, clustering_order, type FROM system_schema.columns WHERE keyspace_name = 'helios'"
            echo "# options: table gc_grace_seconds default_time_to_live compaction_class scaling_parameters"
            q "SELECT table_name, gc_grace_seconds, default_time_to_live, compaction['class'], compaction['scaling_parameters'] FROM system_schema.tables WHERE keyspace_name = 'helios'"
          } > "$actual"
          diff -u docs/Cassandra/schema/expected-schema.txt "$actual"
          echo "schema matches docs/Cassandra/schema/expected-schema.txt ($(grep -vc '^#' "$actual") rows)"

      # ADR-aacruzgon-0020, Rule 1: the tests use this job's node, with the
      # schema just applied, through its published port, as cqlsh does above.
      # Already built, so this step only runs the two binaries. The capability
      # contract's Cassandra instance tests skip without the variable, so they
      # run only here.
      - name: cargo test --test cassandra_tests --test backend_capability_contract against this node
        run: |
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
            cargo test -p helios-persistence --features cassandra \
              --test cassandra_tests --test backend_capability_contract

      # Milestone A (roadmap Step 2, item 2.7): the real hfs binary on this
      # node, POST /Patient then GET /Patient/{id}. Built above.
      - name: Milestone A round trip through hfs against this node
        run: |
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
            cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a -- --exact milestone_a_create_then_read_through_rest

      # Step 2's exit criterion: /_readiness reports down while Cassandra is
      # stopped, and up once it is back. The test stops and starts this job's
      # own node, named by HFS_TEST_CASSANDRA_STOPPABLE_CONTAINER (the opt-in;
      # the test checks the container publishes the URL's port), so it is the
      # job's last test step. --nocapture prints the down and up times.
      - name: Milestone A readiness, stopping and starting this job's node (last test step)
        run: |
          HFS_TEST_CASSANDRA_URL="127.0.0.1:$CASSANDRA_HOST_PORT" \
          HFS_TEST_CASSANDRA_STOPPABLE_CONTAINER=hfs-cassandra-ci-cassandra-1 \
            cargo test -p helios-hfs --no-default-features --features R4,cassandra \
              --test cassandra_milestone_a -- --exact readiness_reports_down_while_cassandra_is_stopped \
              --nocapture

      - name: Cassandra logs
        if: failure()
        run: docker compose -p hfs-cassandra-ci logs --tail 200

      # down -v is safe here only because -p names CI's own project.
      - name: Stop Cassandra and remove CI's volume
        if: always()
        run: docker compose -p hfs-cassandra-ci down -v --remove-orphans
