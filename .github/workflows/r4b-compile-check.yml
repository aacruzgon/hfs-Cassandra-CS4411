name: R4B compile check

# Roadmap item 0.4: proves the Cassandra backend assumes nothing R4-specific
# by compiling helios-persistence with R4B as the only FHIR version. Runs on
# the team's self-hosted runners (ADR-aacruzgon-0018, ADR-sam-michaels-0001);
# a light job, so on either one (ADR-aacruzgon-0023). It reports the size of
# its target directory and where its time went (.github/scripts/ci-report.py),
# in the run's summary page and in the artifact ci-report-r4b-check; reports
# never fail the job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The job's last report reads its own step timings from the Actions API
  # (.github/scripts/job-step-timings.py). Read-only, like contents.
  actions: read

# One run per ref; a newer push supersedes the run in flight.
concurrency:
  group: r4b-compile-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by environment, which rustup ranks above any directory override left
  # on the runner (the inherited ci.yml hit exactly that). Cargo itself refuses
  # a toolchain older than the workspace rust-version, 1.91.1.
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  r4b-check:
    name: cargo check (cassandra, R4B)
    # Fork guard (ADR-aacruzgon-0018). It only keeps this unmodified workflow
    # from running a fork's code; approval is what keeps forks off the runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hfs-cassandra-light]
    timeout-minutes: 30
    env:
      # The commit and build profile the CI reports name (ci-report.py
      # context): on a pull request, its head, not the merge commit
      # GITHUB_SHA names.
      CI_REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_REPORT_PROFILE: dev (cargo check only)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config, where build scripts and
          # proc-macros run by cargo could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable

      # No rust-cache: each runner is one fixed machine (ADR-sam-michaels-0002).
      # The cargo registry already persists in the runner user's ~/.cargo, and
      # the target directory lives next to the checkout, not in it, so the
      # checkout's git clean leaves it alone and cargo reuses every unchanged
      # crate, the generated FHIR models included. Cargo never deletes stale
      # artifacts, so the directory is wiped when the toolchain or Cargo.lock
      # changes, or when it passes its size cap. CARGO_TARGET_DIR is exported
      # here because the runner context is not available in a job-level env.
      - name: Reset the target dir if it is stale or over its cap
        env:
          TARGET_DIR: ${{ runner.workspace }}/target/r4b-compile-check
          CAP_GB: 10
        run: |
          stamp="$(rustc -V) $(sha256sum Cargo.lock | cut -c1-16)"
          # One du, in bytes; size_gb rounds up, as du --block-size=1G does.
          before_bytes=$(du -s --block-size=1 "$TARGET_DIR" 2>/dev/null | cut -f1)
          size_gb=$(( (${before_bytes:-0} + 1073741823) / 1073741824 ))
          old_stamp=$(cat "$TARGET_DIR/.stamp" 2>/dev/null || true)
          reset=no reason=
          if [ "$old_stamp" != "$stamp" ] || [ "$size_gb" -gt "$CAP_GB" ]; then
            if [ -z "$old_stamp" ]; then reason="no stamp: a new or emptied directory"
            elif [ "$old_stamp" != "$stamp" ]; then reason="stamp changed: the toolchain or Cargo.lock"
            else reason="$size_gb GB, over the $CAP_GB GB cap"; fi
            reset=yes
            echo "Resetting $TARGET_DIR (size $size_gb GB, cap $CAP_GB GB, stamp: $stamp; $reason)"
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR" && echo "$stamp" > "$TARGET_DIR/.stamp"
          echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          # For the build-size report (.github/scripts/build-size-report.py).
          {
            echo "TARGET_DIR_BEFORE_BYTES=${before_bytes:-0}"
            echo "TARGET_DIR_RESET=$reset"
            echo "TARGET_DIR_RESET_REASON=$reason"
            echo "TARGET_DIR_CAP_GB=$CAP_GB"
          } >> "$GITHUB_ENV"

      # Wrapped in ci-report.py build: the wall time, the runner cgroup's
      # memory peaks and OOM kills, and cargo's --timings chart, which does
      # not change what is checked. It exits with cargo's status.
      - name: cargo check -p helios-persistence --no-default-features --features cassandra,R4B
        run: |
          python3 .github/scripts/ci-report.py build build-r4b-check "Build: cargo check (cassandra, R4B)" -- \
            cargo check -p helios-persistence --no-default-features --features cassandra,R4B --timings

      # The Cassandra test targets in the same R4B-only build: the library
      # check above never compiles a test, so a test that assumes R4
      # (FhirVersion::default() is gated on the R4 feature) went unseen by
      # every required check. The two targets are named, not --tests: --tests
      # also selects the crate's own unit tests, which need R4 and sqlite
      # (fhir-versions, ADR-aacruzgon-0065).
      - name: cargo check the Cassandra test targets (cassandra, R4B)
        run: |
          python3 .github/scripts/ci-report.py build build-r4b-check-tests "Build: cargo check the Cassandra test targets (cassandra, R4B)" -- \
            cargo check -p helios-persistence --no-default-features --features cassandra,R4B \
              --test cassandra_tests --test backend_capability_contract

      # The persistent target directory before and after this job, and
      # whether the reset step reset it and why
      # (.github/scripts/build-size-report.py). Report only.
      - name: Report the target directory's size
        if: always()
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/ci-report/inputs/build-size"
          python3 .github/scripts/build-size-report.py "$out"
          python3 .github/scripts/ci-report.py add build-size "Target directory size" \
            --markdown "$out/build-size.md" --json "$out/build-size.json"

      # Where this job's time went (.github/scripts/job-step-timings.py): each
      # finished step's duration, read from the Actions API with this job's
      # token, which the workflow's `actions: read` allows. Steps after this
      # one are not finished, so they are listed untimed. Report only.
      - name: Report where this job's time went
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/ci-report/inputs/step-timings"
          python3 .github/scripts/job-step-timings.py "cargo check (cassandra, R4B)" "$out"
          python3 .github/scripts/ci-report.py add step-timings "Where this job's time went" \
            --markdown "$out/step-timings.md" --json "$out/step-timings.json"

      # Every report section of this job (.github/scripts/ci-report.py), as
      # JSON and Markdown, plus the raw outputs they were read from. Report
      # only: an upload failure does not fail the job.
      - name: Upload the CI report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-r4b-check
          path: ${{ runner.temp }}/ci-report
          if-no-files-found: warn
          overwrite: true
