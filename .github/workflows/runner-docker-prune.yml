name: Runner Docker prune

# Weekly clean-up of each self-hosted runner's own rootless Docker daemon
# (ADR-sam-michaels-0001, ADR-sam-michaels-0002). Each runner reaches its daemon
# through DOCKER_HOST in its .env, so this never touches any other user's Docker.
# A label shared by both runners would reach only one of them, so the job is a
# matrix over each machine's own label (ADR-aacruzgon-0023). acruzdebian has
# two runner instances under the same user, gh-runner, so one daemon
# (ADR-aacruzgon-0086): only the first instance's label is in the matrix, and
# the other instance may be running a job while this prunes.
# Scheduled workflows run from the default branch only.

on:
  schedule:
    # Saturdays 20:00 UTC: 16:00 Eastern in summer time, 15:00 in winter
    # (cron is UTC). Sam's rig is usually on then; a run queued while a
    # runner is off waits up to 24 h for it (ADR-sam-michaels-0003).
    - cron: "0 20 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-docker-prune
  cancel-in-progress: false

jobs:
  prune:
    name: docker system prune (gh-runner)
    # Fork guard (ADR-aacruzgon-0018); schedule and dispatch always pass it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      # One runner's prune failing must not cancel the other's.
      fail-fast: false
      matrix:
        runner: [hfs-runner-sam-7900x, hfs-runner-acruzdebian]
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 15
    steps:
      # Without --all, tagged images such as the pinned cassandra image stay,
      # so the next Cassandra job does not download it again. Stopped
      # containers, unused networks, dangling images and build cache go, but
      # only those created more than 24 hours ago (until=24h): another runner
      # instance on the same daemon may be running a job right now, which can
      # hold a container it stopped on purpose (the readiness test's docker
      # stop), or a network that compose up has made but not yet attached
      # (ADR-aacruzgon-0086). No job runs for 24 hours (the longest
      # timeout-minutes is 160). docker system prune refuses until with
      # --volumes, so the volumes are pruned on their own: anonymous ones no
      # container uses (Docker 23 and later leave named volumes, such as
      # each Compose project's, to --all, which this never passes).
      - name: docker system prune, then docker volume prune
        run: |
          # Refuse to prune any daemon but gh-runner's own rootless one.
          want="unix:///run/user/$(id -u)/docker.sock"
          if [ "${DOCKER_HOST:-}" != "$want" ]; then
            echo "::error::DOCKER_HOST is '${DOCKER_HOST:-unset}', expected '$want'; not pruning."
            exit 1
          fi
          echo "Daemon: $DOCKER_HOST"
          docker system df
          docker system prune --force --filter until=24h
          docker volume prune --force
          docker system df
