name: Runner Docker prune

# Weekly clean-up of each self-hosted runner's own rootless Docker daemon
# (ADR-sam-michaels-0001, ADR-sam-michaels-0002). Each runner reaches its daemon
# through DOCKER_HOST in its .env, so this never touches any other user's Docker.
# A label shared by both runners would reach only one of them, so the job is a
# matrix over each runner's own label (ADR-aacruzgon-0023).
# Scheduled workflows run from the default branch only.

on:
  schedule:
    # Saturdays 20:00 UTC: 16:00 Eastern in summer time, 15:00 in winter
    # (cron is UTC). Sam's rig is usually on then; a run queued while a
    # runner is off waits up to 24 h for it (ADR-sam-michaels-0003).
    - cron: "0 20 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-docker-prune
  cancel-in-progress: false

jobs:
  prune:
    name: docker system prune (gh-runner)
    # Fork guard (ADR-aacruzgon-0018); schedule and dispatch always pass it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      # One runner's prune failing must not cancel the other's.
      fail-fast: false
      matrix:
        runner: [hfs-runner-sam-7900x, hfs-runner-acruzdebian]
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 15
    steps:
      # Without --all, tagged images such as the pinned cassandra image stay,
      # so the next Cassandra job does not download it again. Stopped
      # containers, unused networks, dangling images, build cache and
      # anonymous volumes go. Jobs run one at a time on this runner, so no CI
      # container is running while this does.
      - name: docker system prune --force --volumes
        run: |
          # Refuse to prune any daemon but gh-runner's own rootless one.
          want="unix:///run/user/$(id -u)/docker.sock"
          if [ "${DOCKER_HOST:-}" != "$want" ]; then
            echo "::error::DOCKER_HOST is '${DOCKER_HOST:-unset}', expected '$want'; not pruning."
            exit 1
          fi
          echo "Daemon: $DOCKER_HOST"
          docker system df
          docker system prune --force --volumes
          docker system df
